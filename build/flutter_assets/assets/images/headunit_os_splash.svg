<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#101826"/>
      <stop offset="55%" stop-color="#0a0f18"/>
      <stop offset="100%" stop-color="#04070c"/>
    </radialGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fd0ff"/>
      <stop offset="55%" stop-color="#4f7dff"/>
      <stop offset="100%" stop-color="#7a5cff"/>
    </linearGradient>

    <linearGradient id="ringFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3fd0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7a5cff" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fd0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3fd0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3fd0ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="720" fill="url(#bgGlow)"/>

  <!-- faint horizon grid, suggests road/dash -->
  <g stroke="#1c2735" stroke-width="1" opacity="0.5">
    <line x1="0" y1="620" x2="1280" y2="620"/>
    <line x1="0" y1="660" x2="1280" y2="660"/>
    <line x1="0" y1="700" x2="1280" y2="700"/>
  </g>
  <g stroke="#20304a" stroke-width="1" opacity="0.35">
    <line x1="120" y1="720" x2="420" y2="600"/>
    <line x1="360" y1="720" x2="540" y2="600"/>
    <line x1="640" y1="720" x2="640" y2="600"/>
    <line x1="920" y1="720" x2="740" y2="600"/>
    <line x1="1160" y1="720" x2="860" y2="600"/>
  </g>

  <!-- emblem: speed ring with H mark -->
  <g transform="translate(640,300)" filter="url(#softGlow)">
    <circle r="118" fill="none" stroke="#16202f" stroke-width="10"/>
    <circle r="118" fill="none" stroke="url(#ringFade)" stroke-width="10"
            stroke-linecap="round" stroke-dasharray="520" stroke-dashoffset="140"
            transform="rotate(-90)"/>

    <!-- stylized H formed from two pillars + a speed chevron crossbar -->
    <g fill="url(#accent)">
      <rect x="-58" y="-52" width="18" height="104" rx="4"/>
      <rect x="40" y="-52" width="18" height="104" rx="4"/>
      <path d="M -58 -4 L 58 -18 L 58 2 L -58 16 Z"/>
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(640,468)" text-anchor="middle">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="56"
          font-weight="700" letter-spacing="6" fill="#eef4fb">HEADUNIT</text>
    <text x="0" y="46" font-family="Arial, Helvetica, sans-serif" font-size="30"
          font-weight="400" letter-spacing="14" fill="url(#accent)">OS</text>
  </g>

  <!-- tagline -->
  <text x="640" y="528" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="16" letter-spacing="3" fill="#5f7186">DRIVE  CONNECTED</text>



  <!-- subtle animated sweep across ring -->
  <rect x="0" y="0" width="1280" height="2" fill="url(#sweep)" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <!-- version / footer -->
  <text x="640" y="672" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="13" letter-spacing="2" fill="#3a475a">v1.0 &#8226; INITIALIZING SYSTEM</text>
</svg>
